{% extends 'base.html' %}

{% block title %}Add Trek - TREKKMATE{% endblock %}

{% block content %}

<h2>Add New Trek</h2>
<p class="text-muted">Fill in the details to create a new trek.</p>

<div class="card" style="max-width: 700px;">
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin_add_trek') }}">
            <div class="mb-3">
                <label for="name" class="form-label">Trek Name</label>
                <input type="text" class="form-control" id="name" name="name" required placeholder="e.g. Kedarkantha Trek">
            </div>
            <div class="mb-3">
                <label for="location" class="form-label">Location</label>
                <input type="text" class="form-control" id="location" name="location" required placeholder="e.g. Uttarakhand">
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="difficulty" class="form-label">Difficulty</label>
                    <select class="form-select" id="difficulty" name="difficulty" required>
                        <option value="Easy">Easy</option>
                        <option value="Moderate">Moderate</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="duration" class="form-label">Duration (days)</label>
                    <input type="number" class="form-control" id="duration" name="duration" required min="1" placeholder="e.g. 6">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="total_slots" class="form-label">Total Slots</label>
                    <input type="number" class="form-control" id="total_slots" name="total_slots" required min="1" placeholder="e.g. 20">
                </div>
                <div class="col-md-6">
                    <label for="price" class="form-label">Price (Rs.)</label>
                    <input type="number" class="form-control" id="price" name="price" required min="0" placeholder="e.g. 8500">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="start_date" class="form-label">Start Date</label>
                    <input type="date" class="form-control" id="start_date" name="start_date" required>
                </div>
                <div class="col-md-6">
                    <label for="end_date" class="form-label">End Date</label>
                    <input type="date" class="form-control" id="end_date" name="end_date" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3" placeholder="Brief description of the trek..."></textarea>
            </div>
            <button type="submit" class="btn btn-success">Add Trek</button>
            <a href="{{ url_for('admin_treks') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
