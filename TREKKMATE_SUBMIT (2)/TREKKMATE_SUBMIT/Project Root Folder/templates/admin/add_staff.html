{% extends 'base.html' %}

{% block title %}Add Staff - TREKKMATE{% endblock %}

{% block content %}

<h2>👤 Add New Staff Member</h2>
<p class="text-muted">Create a staff account directly.</p>

<div class="card" style="max-width: 600px;">
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin_add_staff') }}">
            <div class="mb-3">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="full_name" name="full_name" required placeholder="Enter full name">
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Choose a username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Set a password">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="Enter email">
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone" placeholder="Phone number">
            </div>
            <button type="submit" class="btn btn-success">Add Staff</button>
            <a href="{{ url_for('admin_staff') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
